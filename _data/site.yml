    summary:
        - 'I am a Ph.D. candidate in the <a href="https://dslab.postech.ac.kr/">Data Systems Lab</a> at <a href="https://postech.ac.kr">Pohang University of Science and Technology (POSTECH)</a>, advised by Professor <a href="https://wscrony.github.io/">Wook-Shin Han</a>. My research interest lies in the field of Natural Language Processing (NLP) and Information Retrieval (IR), particularly in developing foundation models with retrieval. I have hands-on experience in pre-training language models and fine-tuning them for downstream tasks such as text retrieval and semantic parsing.'
