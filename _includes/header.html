<!--
  Site header with simplified navigation
  Renders person information from _data/site.yml
-->
<div class="header">
    <div class="header__content">
        <!-- Site name -->
        <div class="header__title">
            <h1 class="site__name">{{ site.data.site.person.name }}</h1>
        </div>

        <!-- Navigation -->
        <nav class="header__nav" aria-label="Main navigation">
            <ul class="header__nav-list">
                <li class="header__nav-item">
                    <a href="#about" class="header__nav-link">About</a>
                </li>
                {% if site.data.site.work_experience or site.data.site.publications %}
                <li class="header__nav-item">
                    <a href="#news" class="header__nav-link">News</a>
                </li>
                {% endif %}
                {% if site.data.site.publications %}
                <li class="header__nav-item">
                    <a href="#publications" class="header__nav-link">Publications</a>
                </li>
                {% endif %}
                <li class="header__nav-item">
                    <a href="#contact" class="header__nav-link">Contact</a>
                </li>
            </ul>
        </nav>

        <!-- Theme Toggle -->
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" aria-pressed="false">
            <span class="theme-toggle__icon theme-toggle__icon--light">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"/>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                </svg>
            </span>
            <span class="theme-toggle__icon theme-toggle__icon--dark">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </span>
        </button>
    </div>
</div>
